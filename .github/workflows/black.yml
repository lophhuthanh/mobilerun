name: kiểm tra trực tiếp (RDP + bore)
on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '3h'
          - '5h'
          - '5h40m'
jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      # BANNER CHÀO MỪNG
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          Write-Host ""
          Write-Host "🤖 AI STV PREMIUM RDP SERVER" -ForegroundColor Yellow
          Write-Host "⚡ Powered by AI STV" -ForegroundColor Green
          Write-Host "🕒 Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host ""
          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')
          for($i=0; $i -lt 10; $i++) {
            Write-Host "`r🚀 Đang khởi tạo hệ thống... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
            Start-Sleep -Milliseconds 100
          }
          Write-Host "`r✅ Hệ thống đã sẵn sàng!" -ForegroundColor Green

      # BẬT REMOTE DESKTOP + ĐẶT MẬT KHẨU
      - name: 🖥️ BẬT REMOTE DESKTOP
        run: |
          function New-PremiumPassword {
            $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
            $lower = 'abcdefghijkmnpqrstuvwxyz'
            $numbers = '23456789'
            $all = $upper + $lower + $numbers
            $pw = $upper[(Get-Random -Maximum $upper.Length)] + $lower[(Get-Random -Maximum $lower.Length)] + $numbers[(Get-Random -Maximum $numbers.Length)]
            for ($i = 1; $i -le 9; $i++) { $pw += $all[(Get-Random -Maximum $all.Length)] }
            return -join ($pw.ToCharArray() | Sort-Object { Get-Random })
          }

          # Tài khoản đăng nhập RDP
          $rdpUser = "runneradmin"
          $rdpPass = if ($env:CUSTOM_RDP_PASS) { $env:CUSTOM_RDP_PASS } else { New-PremiumPassword }

          Write-Host "🔐 Đang đặt mật khẩu cho $rdpUser..." -ForegroundColor Yellow
          $securePass = ConvertTo-SecureString $rdpPass -AsPlainText -Force
          Set-LocalUser -Name $rdpUser -Password $securePass
          # Không cho mật khẩu hết hạn trong phiên
          Set-LocalUser -Name $rdpUser -PasswordNeverExpires $true -ErrorAction SilentlyContinue

          Write-Host "⚙️  Đang bật Remote Desktop..." -ForegroundColor Yellow
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          # Bật Network Level Authentication cho bảo mật
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          Write-Host "🔧 Đang mở firewall cho Remote Desktop..." -ForegroundColor Yellow
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow RDP 3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null

          # Đảm bảo user thuộc nhóm Remote Desktop Users
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $rdpUser -ErrorAction SilentlyContinue

          echo "RDP_USER=$rdpUser" >> $env:GITHUB_ENV
          echo "RDP_PASS=$rdpPass" >> $env:GITHUB_ENV
          Write-Host "✅ Remote Desktop đã bật | User: $rdpUser" -ForegroundColor Green

      # CÀI TUNNEL BORE (NAT cổng 3389 ra public)
      - name: 🌐 TẠO TUNNEL BORE
        run: |
          $boreVersion = "v0.6.0"
          $boreZip = "$env:TEMP\bore.zip"
          $boreDir = "$env:TEMP\bore"

          Write-Host "📥 Đang tải bore $boreVersion..." -ForegroundColor Yellow
          $url = "https://github.com/ekzhang/bore/releases/download/$boreVersion/bore-$boreVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $boreZip -UseBasicParsing
          Expand-Archive -Path $boreZip -DestinationPath $boreDir -Force
          $boreExe = (Get-ChildItem -Path $boreDir -Filter "bore.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $boreExe) { Write-Host "❌ Không thấy bore.exe" -ForegroundColor Red; exit 1 }

          Write-Host "🚀 Đang mở tunnel tới bore.pub..." -ForegroundColor Yellow
          $logFile = "$env:TEMP\bore.log"
          Remove-Item $logFile -ErrorAction SilentlyContinue
          # Chạy nền, ghi log để lấy port được cấp
          Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput $logFile -RedirectStandardError "$env:TEMP\bore.err" -WindowStyle Hidden

          # Chờ và parse cổng công khai từ log (dạng: listening at bore.pub:XXXXX)
          $borePort = $null
          $tries = 0
          while (-not $borePort -and $tries -lt 30) {
            Start-Sleep -Seconds 2
            if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              $m = [regex]::Match($content, 'bore\.pub:(\d+)')
              if ($m.Success) { $borePort = $m.Groups[1].Value }
            }
            $tries++
          }

          if (-not $borePort) {
            Write-Host "❌ Không lấy được cổng từ bore. Log:" -ForegroundColor Red
            Get-Content $logFile -ErrorAction SilentlyContinue
            Get-Content "$env:TEMP\bore.err" -ErrorAction SilentlyContinue
            exit 1
          }

          echo "BORE_HOST=bore.pub" >> $env:GITHUB_ENV
          echo "BORE_PORT=$borePort" >> $env:GITHUB_ENV
          Write-Host "✅ Tunnel sẵn sàng | bore.pub:$borePort" -ForegroundColor Green

      # HIỂN THỊ THÔNG TIN KẾT NỐI
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
            "3h"    { $totalMinutes = 180; $displayTime = "3 giờ" }
            "5h"    { $totalMinutes = 300; $displayTime = "5 giờ" }
            "5h40m" { $totalMinutes = 340; $displayTime = "5 giờ 40 phút" }
          }
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $thoiGianKetThuc = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)
          Write-Host ""
          Write-Host "┌───────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│          🎉 RDP SẴN SÀNG!             │" -ForegroundColor Cyan
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Output "│ 🌐  Địa chỉ: ${env:BORE_HOST}:${env:BORE_PORT}"
          Write-Output "│ 👤  Tài khoản: $env:RDP_USER"
          Write-Output "│ 🔐  Mật khẩu: $env:RDP_PASS"
          Write-Output "│ ⏰  Thời lượng: $displayTime"
          Write-Output "│ 🕐  Kết thúc: $($thoiGianKetThuc.ToString('HH:mm:ss'))"
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Output "│ 💡 Cách kết nối:"
          Write-Output "│   1. Mở Remote Desktop (mstsc trên Windows)"
          Write-Output "│   2. Computer: ${env:BORE_HOST}:${env:BORE_PORT}"
          Write-Output "│   3. User + Password như trên"
          Write-Host "└───────────────────────────────────────────┘" -ForegroundColor Cyan
          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # DUY TRÌ PHIÊN
      - name: ⏳ DUY TRÌ KẾT NỐI
        run: |
          $totalMinutes = [int]$env:TOTAL_MINUTES
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone).AddMinutes($totalMinutes)
          Write-Host "🔄 Đang duy trì phiên trong $totalMinutes phút..." -ForegroundColor Yellow
          $frames = @('⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏')
          $startTime = Get-Date
          do {
            $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
            $remaining = $endTime - $now
            if ($remaining.TotalSeconds -le 0) { break }
            $h = [math]::Floor($remaining.TotalHours)
            $m = [math]::Floor($remaining.TotalMinutes % 60)
            $s = [math]::Floor($remaining.TotalSeconds % 60)
            $f = $frames[([int]((Get-Date)-$startTime).TotalSeconds) % $frames.Length]
            Write-Host "`r$f ⏳ Còn lại: $h giờ $m phút $s giây" -NoNewline -ForegroundColor Cyan
            # Giữ tunnel sống: nếu bore rớt thì bật lại
            $bore = Get-Process -Name "bore" -ErrorAction SilentlyContinue
            if (-not $bore) {
              Write-Host "`n⚠️  Tunnel bore rớt, đang bật lại..." -ForegroundColor Red
              $boreExe = (Get-ChildItem -Path "$env:TEMP\bore" -Filter "bore.exe" -Recurse | Select-Object -First 1).FullName
              if ($boreExe) {
                Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub --port $env:BORE_PORT" -WindowStyle Hidden
              }
            }
            Start-Sleep -Seconds 5
          } while ($true)
          Write-Host "`n🎯 Hết thời gian" -ForegroundColor Red

      # DỌN DẸP
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          Write-Host "🧹 Đang dọn dẹp..." -ForegroundColor Yellow
          Stop-Process -Name "bore" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\bore.zip" -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\bore" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Dọn dẹp hoàn tất" -ForegroundColor Green
